<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebHub - Sprint In Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #F6F6F6; --surface: #FFFFFF; --surface2: #F3EFFF;
    --text: #1E0B3A; --text-muted: #6B5A8A; --accent: #7E3DD4;
    --green: #8FA800; --red: #C438A3;
    --accent-glow: rgba(126, 61, 212, 0.15);
    --ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --duration-fast: 150ms;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }

  /* Top Nav */
  .top-nav {
    background: #1E0B3A; padding: 12px 32px; display: flex;
    align-items: center; justify-content: space-between;
  }
  .nav-logo {
    display: flex; align-items: center; gap: 10px;
  }
  .nav-links {
    display: flex; gap: 8px;
  }
  .nav-link {
    padding: 8px 18px; border-radius: 100px; font-size: 0.85rem;
    font-weight: 600; text-decoration: none; transition: background 0.2s;
    background: transparent; color: #B8A6F2;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .nav-link:hover {
    background: rgba(126, 61, 212, 0.2); text-decoration: none; color: #B8A6F2;
  }
  .nav-link.active {
    background: var(--accent); color: #FFFFFF;
  }
  .nav-link.active:hover {
    background: var(--accent); color: #FFFFFF;
  }

  /* Content */
  .content { max-width: 900px; margin: 0 auto; padding: 32px; }

  /* Header */
  .page-header { margin-bottom: 0; }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .page-title { font-size: 1.6rem; font-weight: 700; color: var(--text); }
  .sprint-info { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }
  .ticket-count-pill {
    background: var(--surface2); color: var(--accent); padding: 4px 12px;
    border-radius: 100px; font-size: 0.8rem; font-weight: 700;
  }

  /* Status filter pills */
  .status-filters { display: flex; gap: 8px; margin: 20px 0 28px; flex-wrap: wrap; }
  .status-filter {
    padding: 6px 16px; border-radius: 100px; border: 1px solid #E7DFFF;
    background: var(--surface); color: var(--text-muted); font-size: 0.82rem;
    font-weight: 600; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif;
    transition: all 0.15s;
  }
  .status-filter:hover { background: var(--surface2); }
  .status-filter.active { background: #7E3DD4; color: #FFFFFF; border-color: #7E3DD4; }
  .status-filter:active { transform: scale(0.97); }

  /* Workstream sections */
  .workstream-section { margin-bottom: 32px; }
  .workstream-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 10px; border-bottom: 2px solid #E7DFFF; margin-bottom: 4px;
  }
  .workstream-name { font-size: 1.1rem; font-weight: 700; color: var(--text); }
  .workstream-count {
    background: var(--surface2); color: var(--accent); padding: 2px 10px;
    border-radius: 100px; font-size: 0.75rem; font-weight: 700;
  }

  /* Ticket rows */
  .ticket-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-bottom: 1px solid #F3EFFF;
    text-decoration: none; color: var(--text); transition: background 0.1s;
    border-radius: 6px;
  }
  .ticket-row:hover { background: var(--surface2); }
  .ticket-key {
    flex-shrink: 0; width: 72px; font-size: 0.8rem; font-weight: 700;
    color: var(--accent);
  }
  .ticket-title {
    flex: 1; font-size: 0.88rem; font-weight: 500; color: var(--text);
    line-height: 1.4;
  }
  .ticket-status {
    flex-shrink: 0; padding: 3px 10px; border-radius: 100px;
    font-size: 0.7rem; font-weight: 700; color: #FFFFFF;
    text-transform: uppercase; white-space: nowrap;
  }
  .ticket-assignee {
    flex-shrink: 0; width: 100px; font-size: 0.75rem; color: var(--text-muted);
    font-weight: 500; text-align: right; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  /* Loading overlay */
  #loading-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; flex-direction: column; gap: 16px;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.85; }
  }

  /* Error state */
  .error-message {
    text-align: center; padding: 60px 20px;
    color: var(--text-muted); font-size: 0.95rem;
  }

  /* Empty state */
  .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

  /* Responsive */
  @media (max-width: 600px) {
    .content { padding: 16px; }
    .ticket-row { flex-wrap: wrap; gap: 6px; }
    .ticket-assignee { width: auto; text-align: left; }
  }
  @media (max-width: 500px) {
    .top-nav { flex-direction: column; gap: 8px; padding: 12px 16px; }
    .nav-links { width: 100%; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* Premium Workbench reskin */
  :root {
    --bg: oklch(0.975 0.008 305);
    --surface: oklch(0.998 0.004 305);
    --surface2: oklch(0.957 0.018 305);
    --text: oklch(0.19 0.055 300);
    --text-muted: oklch(0.48 0.05 300);
    --text-soft: oklch(0.62 0.038 300);
    --accent: oklch(0.49 0.19 300);
    --accent-strong: oklch(0.38 0.16 300);
    --accent-soft: oklch(0.93 0.042 300);
    --green: oklch(0.55 0.14 132);
    --red: oklch(0.52 0.17 345);
    --border: oklch(0.88 0.025 305);
    --border-strong: oklch(0.78 0.045 305);
    --shadow: 0 14px 40px rgba(33, 13, 61, 0.08);
    --shadow-soft: 0 8px 24px rgba(33, 13, 61, 0.06);
    --nav-h: 58px;
  }
  body {
    background:
      linear-gradient(180deg, oklch(0.988 0.008 305), var(--bg) 360px);
    overflow-x: hidden;
  }
  .top-nav {
    position: sticky; top: 0; z-index: 120;
    height: var(--nav-h); padding: 10px 28px;
    background: color-mix(in oklch, var(--text) 94%, var(--accent) 6%);
    border-bottom: 1px solid color-mix(in oklch, var(--accent) 34%, transparent);
    box-shadow: 0 10px 28px rgba(30, 11, 58, 0.16);
  }
  .nav-logo > div {
    width: 34px !important; height: 34px !important; border-radius: 8px !important;
    background: var(--accent) !important;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22);
  }
  .nav-logo span { font-size: 1rem !important; letter-spacing: 0; }
  .nav-links {
    gap: 4px; padding: 4px; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; background: rgba(255,255,255,0.06);
    max-width: 100%;
  }
  .nav-link {
    padding: 7px 14px; font-size: 0.82rem; font-weight: 800;
    color: oklch(0.79 0.055 304); border-radius: 999px;
  }
  .nav-link:hover { background: rgba(255,255,255,0.09); color: oklch(0.96 0.015 305); }
  .nav-link.active, .nav-link.active:hover {
    background: var(--surface); color: var(--accent-strong);
    box-shadow: 0 4px 14px rgba(0,0,0,0.16);
  }
  .content {
    width: min(980px, calc(100vw - 40px));
    max-width: none; padding: 24px 0 32px;
  }
  .page-header {
    padding: 18px; margin-bottom: 12px;
    background: color-mix(in oklch, var(--surface) 88%, var(--accent-soft) 12%);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow-soft);
  }
  .page-title {
    font-size: 1.5rem; font-weight: 850; letter-spacing: 0; line-height: 1.15;
  }
  .sprint-info { color: var(--text-muted); font-weight: 700; }
  .ticket-count-pill, .workstream-count {
    background: var(--surface); color: var(--accent-strong);
    border: 1px solid var(--border); border-radius: 999px;
  }
  .ticket-count-pill { padding: 5px 12px; font-weight: 850; }
  .status-filters {
    position: sticky; top: calc(var(--nav-h) + 10px); z-index: 90;
    margin: 0 0 16px; padding: 8px;
    background: color-mix(in oklch, var(--surface) 92%, var(--accent-soft) 8%);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow-soft); backdrop-filter: blur(14px);
  }
  .status-filter {
    border-color: var(--border); background: var(--surface); color: var(--text-muted);
    border-radius: 999px; padding: 8px 13px; font-weight: 850;
  }
  .status-filter:hover { background: var(--surface2); color: var(--text); }
  .status-filter.active {
    background: var(--text); color: var(--surface); border-color: var(--text);
  }
  .workstream-section {
    margin-bottom: 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .workstream-header {
    padding: 13px 16px; margin: 0; border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .workstream-name { font-size: 0.95rem; font-weight: 850; }
  .ticket-list { padding: 4px; }
  .ticket-row {
    display: grid; grid-template-columns: 78px minmax(0, 1fr) auto 100px;
    min-height: 44px; padding: 10px 12px; border-bottom: none;
    border-radius: 7px; transition: background var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
  }
  .ticket-row:hover { background: var(--accent-soft); text-decoration: none; transform: translateX(2px); }
  .ticket-key { width: 78px; color: var(--accent-strong); font-weight: 850; }
  .ticket-title { font-weight: 650; min-width: 0; }
  .ticket-status { border-radius: 999px; font-weight: 850; letter-spacing: 0; }
  .ticket-assignee { color: var(--text-soft); font-weight: 700; }
  #loading-overlay { background: var(--bg); }
  #loading-overlay .loading-mark {
    border-radius: 8px !important; background: var(--accent) !important;
    box-shadow: var(--shadow-soft);
  }
  #loading-overlay .loading-text {
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    color: var(--text-muted) !important;
  }
  .empty-state, .error-message {
    padding: 44px 20px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow-soft);
  }
  .app-credit { text-align:center; padding: 0 0 8px; font-size: 0.76rem; color: var(--text-soft); font-weight: 700; }
  .app-credit strong { color: var(--accent-strong); font-weight: 850; }
  @media (max-width: 600px) {
    .content { width: calc(100vw - 48px); max-width: 680px; padding-top: 16px; margin-left: auto; margin-right: auto; }
    .header-top { display: block; }
    .ticket-count-pill { display: inline-flex; margin-top: 12px; }
    .status-filters { position: static; }
    .page-header, .status-filters, .workstream-section { min-width: 0; width: 100%; }
    .ticket-row {
      grid-template-columns: 1fr;
      gap: 7px; align-items: start;
    }
    .ticket-row > * { min-width: 0; }
    .ticket-key { width: auto; grid-column: 1; }
    .ticket-title { grid-column: 1; overflow-wrap: anywhere; }
    .ticket-status { grid-column: 1; justify-self: start; }
    .ticket-assignee { grid-column: 1; justify-self: start; width: auto; max-width: 100%; text-align: left; }
  }
  @media (max-width: 500px) {
    :root { --nav-h: auto; }
    .top-nav { height: auto; }
    .nav-links { display: grid; grid-template-columns: repeat(2, max-content); overflow-x: visible; flex-wrap: wrap; justify-content: center; justify-items: center; row-gap: 6px; }
    .nav-link { flex: 0 0 auto; padding: 7px 10px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-logo">
    <div style="width:32px;height:32px;border-radius:10px;background:#7E3DD4;display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg>
    </div>
    <span style="font-weight:700;font-size:1.1rem;color:#FFFFFF;">WebHub</span>
  </div>
  <div class="nav-links">
    <a href="/requests" class="nav-link">Requests</a>
    <a href="/progress" class="nav-link active">In Progress</a>
    <a href="/dashboard" class="nav-link">Dashboard</a>
    <a href="/consent" class="nav-link">Consent Metrics</a>
    <a href="/speed-index" class="nav-link">Speed Index</a>
  </div>
</nav>

<div id="loading-overlay">
  <div class="loading-mark" style="width:48px;height:48px;border-radius:12px;background:#7E3DD4;display:flex;align-items:center;justify-content:center;animation:pulse 1.5s ease-out infinite;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
  </div>
  <div class="loading-text" style="font-family:'Plus Jakarta Sans',sans-serif;color:#6B5A8A;font-size:0.9rem;font-weight:700;">Loading sprint data...</div>
</div>

<div class="content" id="main-content" style="display:none;">
  <div class="page-header">
    <div class="header-top">
      <div>
        <div class="page-title">Sprint In Progress</div>
        <div class="sprint-info" id="sprint-info"></div>
      </div>
      <span class="ticket-count-pill" id="ticket-count-pill"></span>
    </div>
  </div>
  <div class="status-filters" id="status-filters"></div>
  <div id="ticket-list-container"></div>
  <div class="empty-state" id="empty-state" style="display:none;">No tickets found in the active sprint.</div>
</div>

<div class="app-credit">Built with <strong>Claude Code + Codex</strong></div>

<script>
var STATUS_COLORS = {
  'To Do': '#8E8797',
  'Planning': '#8E8797',
  'In Progress': '#7E3DD4',
  'Developing': '#7E3DD4',
  'In QA': '#8E7AE6',
  'In Designing': '#D94BAF',
  'Blocked': '#BE3F8F',
  'Blocked - External': '#8E8797',
  'Done': '#789B1B'
};

var STATUS_PRIORITY = {
  'In Progress': 0,
  'Developing': 0,
  'In QA': 1,
  'In Designing': 2,
  'Blocked': 3,
  'To Do': 4,
  'Planning': 4,
  'Done': 5
};

var currentFilter = 'all';
var allSprintTickets = [];

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function getStatusColor(status) {
  return STATUS_COLORS[status] || '#AAAAAA';
}

function getStatusPriority(status) {
  var p = STATUS_PRIORITY[status];
  return (p !== undefined) ? p : 3;
}

function normalizeStatus(status) {
  if (status === 'Developing') return 'In Progress';
  if (status === 'Planning') return 'To Do';
  return status;
}

function formatDateRange(startDate, endDate) {
  if (!startDate || !endDate) return '';
  var start = new Date(startDate);
  var end = new Date(endDate);
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var startStr = months[start.getMonth()] + ' ' + start.getDate();
  var endStr = months[end.getMonth()] + ' ' + end.getDate();
  return startStr + ' \u2013 ' + endStr;
}

function getFilteredTickets() {
  if (currentFilter === 'all') return allSprintTickets;
  var result = [];
  for (var i = 0; i < allSprintTickets.length; i++) {
    var t = allSprintTickets[i];
    var normalized = normalizeStatus(t.status);
    if (normalized === currentFilter) {
      result.push(t);
    }
  }
  return result;
}

function getStatusCounts() {
  var counts = {};
  for (var i = 0; i < allSprintTickets.length; i++) {
    var normalized = normalizeStatus(allSprintTickets[i].status);
    if (!counts[normalized]) counts[normalized] = 0;
    counts[normalized]++;
  }
  return counts;
}

function renderFilters() {
  var counts = getStatusCounts();
  var filterOrder = ['all', 'In Progress', 'In QA', 'To Do', 'Done'];
  var container = document.getElementById('status-filters');
  var html = '';
  for (var i = 0; i < filterOrder.length; i++) {
    var f = filterOrder[i];
    var label = f === 'all' ? 'All' : f;
    var count = f === 'all' ? allSprintTickets.length : (counts[f] || 0);
    var activeClass = (currentFilter === f) ? ' active' : '';
    html += '<button class="status-filter' + activeClass + '" data-filter="' + f + '">';
    html += escapeHtml(label) + ' (' + count + ')';
    html += '</button>';
  }
  container.innerHTML = html;

  var buttons = container.querySelectorAll('.status-filter');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function() {
      currentFilter = this.getAttribute('data-filter');
      renderFilters();
      renderTicketList();
    });
  }
}

function renderTicketList() {
  var tickets = getFilteredTickets();
  var container = document.getElementById('ticket-list-container');
  var emptyState = document.getElementById('empty-state');

  if (tickets.length === 0) {
    container.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  // Group by workstream
  var groups = {};
  var groupOrder = [];
  for (var i = 0; i < tickets.length; i++) {
    var ws = tickets[i].workstream || 'Other';
    if (!groups[ws]) {
      groups[ws] = [];
      groupOrder.push(ws);
    }
    groups[ws].push(tickets[i]);
  }

  // Sort workstreams alphabetically, Other last
  groupOrder.sort(function(a, b) {
    if (a === 'Other') return 1;
    if (b === 'Other') return -1;
    return a.localeCompare(b);
  });

  // Sort tickets within each workstream by status priority
  for (var ws in groups) {
    groups[ws].sort(function(a, b) {
      return getStatusPriority(a.status) - getStatusPriority(b.status);
    });
  }

  var html = '';
  for (var i = 0; i < groupOrder.length; i++) {
    var wsName = groupOrder[i];
    var wsTickets = groups[wsName];
    html += '<div class="workstream-section">';
    html += '<div class="workstream-header">';
    html += '<span class="workstream-name">' + escapeHtml(wsName) + '</span>';
    html += '<span class="workstream-count">' + wsTickets.length + '</span>';
    html += '</div>';
    html += '<div class="ticket-list">';
    for (var j = 0; j < wsTickets.length; j++) {
      var t = wsTickets[j];
      var color = getStatusColor(t.status);
      var jiraUrl = 'https://joinhomebase.atlassian.net/browse/' + escapeHtml(t.key);
      html += '<a class="ticket-row" href="' + jiraUrl + '" target="_blank" rel="noopener">';
      html += '<span class="ticket-key">' + escapeHtml(t.key) + '</span>';
      html += '<span class="ticket-title">' + escapeHtml(t.summary) + '</span>';
      html += '<span class="ticket-status" style="background:' + color + ';">' + escapeHtml(t.status).toUpperCase() + '</span>';
      if (t.assignee) {
        html += '<span class="ticket-assignee">' + escapeHtml(t.assignee) + '</span>';
      }
      html += '</a>';
    }
    html += '</div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

function render(report) {
  var sprints = report.sprints || [];
  var activeSprint = null;
  for (var i = 0; i < sprints.length; i++) {
    if (sprints[i].state === 'active') {
      activeSprint = sprints[i];
    }
  }

  if (!activeSprint) {
    document.getElementById('sprint-info').textContent = 'No active sprint found';
    document.getElementById('empty-state').style.display = 'block';
    return;
  }

  var dateRange = formatDateRange(activeSprint.startDate, activeSprint.endDate);
  var infoText = activeSprint.name;
  if (dateRange) {
    infoText += ' | ' + dateRange;
  }
  document.getElementById('sprint-info').textContent = infoText;

  var allTickets = report.allTickets || [];
  var sprintName = activeSprint.name;
  allSprintTickets = [];
  for (var i = 0; i < allTickets.length; i++) {
    var t = allTickets[i];
    if (t.sprintNames && t.sprintNames.indexOf(sprintName) !== -1) {
      allSprintTickets.push(t);
    }
  }

  document.getElementById('ticket-count-pill').textContent = allSprintTickets.length + ' tickets';

  if (allSprintTickets.length === 0) {
    document.getElementById('empty-state').style.display = 'block';
    return;
  }

  renderFilters();
  renderTicketList();
}

async function loadReport() {
  var overlay = document.getElementById('loading-overlay');
  try {
    var res = await fetch('/api/report');
    if (!res.ok) throw new Error('Failed to load report: ' + res.status);
    var data = await res.json();
    render(data.report || data);
    document.getElementById('main-content').style.display = 'block';
    overlay.style.display = 'none';
  } catch (err) {
    overlay.style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    document.getElementById('ticket-list-container').innerHTML = '<div class="error-message">Failed to load sprint data. Please try again later.</div>';
    console.error(err);
  }
}

loadReport();
</script>
</body>
</html>
